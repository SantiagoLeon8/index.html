<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Simple - Cubo Dorado</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #mensaje {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
        }
        button {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: #ffaa33;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 2px 10px black;
        }
        #estado {
            position: absolute;
            top: 20px;
            right: 20px;
            background: black;
            color: lime;
            padding: 5px 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="mensaje">🔮 REALIDAD AUMENTADA: Toca la pantalla para colocar un cubo dorado</div>
    <div id="estado">⚙️ Inicializando...</div>
    <button id="btnAR">📱 ACTIVAR RA</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        const estadoDiv = document.getElementById('estado');
        function setEstado(msg, error = false) {
            estadoDiv.innerHTML = msg;
            estadoDiv.style.color = error ? '#ff8888' : '#88ff88';
            console.log(msg);
        }

        // Verificar compatibilidad antes de nada
        if (!navigator.xr) {
            setEstado('❌ WebXR no soportado. Usa Chrome Android o Safari iOS 15+', true);
        } else {
            navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                if (supported) {
                    setEstado('✅ WebXR compatible. Pulsa el botón.');
                } else {
                    setEstado('❌ El navegador no soporta AR. Asegúrate de HTTPS y dispositivo compatible.', true);
                }
            });
        }

        // Escena
        const scene = new THREE.Scene();
        scene.background = null; // transparente

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Iluminación
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 2, 1);
        scene.add(light);

        // Cubo dorado
        const cubeMat = new THREE.MeshStandardMaterial({ color: 0xffaa33, metalness: 0.9, roughness: 0.2 });
        const cube = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), cubeMat);
        let placedObject = null;

        // Reticle (anillo)
        const ringGeo = new THREE.RingGeometry(0.12, 0.2, 16);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xffaa44, side: THREE.DoubleSide, transparent: true });
        const reticle = new THREE.Mesh(ringGeo, ringMat);
        reticle.rotation.x = -Math.PI / 2;
        reticle.visible = false;
        scene.add(reticle);

        // Variables hit-test
        let hitTestSource = null;

        // Función para colocar objeto
        function placeObject(position) {
            if (placedObject) scene.remove(placedObject);
            const newCube = cube.clone();
            newCube.position.copy(position);
            scene.add(newCube);
            placedObject = newCube;
            setEstado('✅ Cubo colocado. Pulsa "Volver a colocar" si quieres moverlo.');
        }

        // Configurar sesión AR
        async function setupARSession(session) {
            session.addEventListener('select', () => {
                if (reticle.visible) {
                    placeObject(reticle.position);
                } else {
                    setEstado('⚠️ Mueve la cámara a una superficie plana', true);
                }
            });
            const viewerSpace = await session.requestReferenceSpace('viewer');
            hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
            setEstado('🔍 Apunta a una mesa/suelo y toca la pantalla');
        }

        renderer.xr.addEventListener('sessionstart', async () => {
            const session = renderer.xr.getSession();
            if (session) {
                await setupARSession(session);
                reticle.visible = true;
            }
        });

        renderer.xr.addEventListener('sessionend', () => {
            if (hitTestSource) hitTestSource.cancel();
            hitTestSource = null;
            reticle.visible = false;
            setEstado('🔴 AR finalizado');
        });

        // Botón AR (el de Three.js)
        const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
        arButton.style.position = 'absolute';
        arButton.style.bottom = '30px';
        arButton.style.right = '30px';
        arButton.style.backgroundColor = '#ffaa33';
        arButton.style.color = 'black';
        arButton.style.border = 'none';
        arButton.style.padding = '12px 24px';
        arButton.style.borderRadius = '40px';
        arButton.style.fontWeight = 'bold';
        arButton.style.fontSize = '18px';
        arButton.style.zIndex = '100';
        document.body.appendChild(arButton);
        
        // Ocultamos nuestro botón manual y usamos el de Three.js
        document.getElementById('btnAR').style.display = 'none';

        // Actualizar reticle en cada frame
        function animate() {
            if (hitTestSource && renderer.xr.isPresenting) {
                const frame = renderer.xr.getFrame();
                if (frame) {
                    const viewerSpace = renderer.xr.getReferenceSpace();
                    const results = frame.getHitTestResults(hitTestSource);
                    if (results.length > 0) {
                        const pose = results[0].getPose(viewerSpace);
                        if (pose) {
                            reticle.visible = true;
                            reticle.position.copy(pose.transform.position);
                            reticle.quaternion.copy(pose.transform.orientation);
                        }
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        setEstado('✅ Cargado. Pulsa el botón naranja "ACTIVAR RA"');
    </script>
</body>
</html>
