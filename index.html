<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Figura de Volúmenes en Realidad Aumentada (Dorada)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            color: #ffdd99;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
        }
        #btn-reubicar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #ffaa33;
            color: black;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            font-size: 16px;
        }
        #ar-status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            color: lime;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="info">✨ FIGURA DORADA (Cono+Hiperboloide+Paraboloide+Esfera) | Toca la pantalla para colocar</div>
    <button id="btn-reubicar">📍 Volver a colocar</button>
    <div id="ar-status">🔄 Iniciando...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        // --- Escena, cámara, renderizador (transparente para AR) ---
        const scene = new THREE.Scene();
        scene.background = null;

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- Iluminación realista ---
        const ambient = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambient);
        const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        mainLight.position.set(2, 3, 1.5);
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0xcc8844, 0.5);
        fillLight.position.set(-1, 2, -2);
        scene.add(fillLight);
        const backLight = new THREE.PointLight(0x6688aa, 0.4);
        backLight.position.set(1, 1, -3);
        scene.add(backLight);
        const rimLight = new THREE.PointLight(0xffaa66, 0.7);
        rimLight.position.set(1.5, 2, -2);
        scene.add(rimLight);

        // --- Construcción de la figura (exactamente la de volúmenes) ---
        const figureGroup = new THREE.Group();
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xffaa33, metalness: 0.95, roughness: 0.25, emissive: 0x442200, emissiveIntensity: 0.1 });
        const brightGold = new THREE.MeshStandardMaterial({ color: 0xffcc66, metalness: 0.99, roughness: 0.15 });

        // 1. Cono truncado
        const cono = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 2.2, 2.5, 48), goldMat);
        cono.position.y = -3.0;
        figureGroup.add(cono);

        // 2. Hiperboloide (LatheGeometry)
        const pointsH = [];
        for (let y = -1.5; y <= 2.5; y += 0.2) {
            let r = Math.sqrt(1.8*1.8 + y*y/6);
            r = Math.min(Math.max(r, 1.6), 2.7);
            pointsH.push(new THREE.Vector2(r, y));
        }
        const hiper = new THREE.Mesh(new THREE.LatheGeometry(pointsH, 48), goldMat);
        hiper.position.y = 0.5;
        figureGroup.add(hiper);

        // 3. Paraboloide
        const pointsP = [];
        for (let y = 2.5; y <= 5.5; y += 0.15) {
            let r = 1.6 * (1 - (y-2.5)/3.0);
            if (r < 0) r = 0;
            pointsP.push(new THREE.Vector2(r, y));
        }
        const para = new THREE.Mesh(new THREE.LatheGeometry(pointsP, 48), goldMat);
        para.position.y = 0.5;
        figureGroup.add(para);

        // 4. Esfera
        const esfera = new THREE.Mesh(new THREE.SphereGeometry(1.36, 48, 48), brightGold);
        esfera.position.y = 5.7;
        figureGroup.add(esfera);

        // Anillos decorativos
        const anilloMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, metalness: 0.9 });
        const anillo1 = new THREE.Mesh(new THREE.TorusGeometry(2.05, 0.08, 32, 80), anilloMat);
        anillo1.position.y = -1.8;
        anillo1.rotation.x = Math.PI/2;
        figureGroup.add(anillo1);
        const anillo2 = new THREE.Mesh(new THREE.TorusGeometry(2.35, 0.08, 32, 80), anilloMat);
        anillo2.position.y = 0.8;
        anillo2.rotation.x = Math.PI/2;
        figureGroup.add(anillo2);

        figureGroup.scale.set(0.7, 0.7, 0.7);

        // --- Objeto que se colocará en AR (clon para poder reubicar) ---
        let currentObject = null;

        function createPlacedObject() {
            const group = figureGroup.clone(true);
            group.scale.set(0.8, 0.8, 0.8);
            group.position.y = -0.1; // base toca suelo
            return group;
        }

        // --- Sistema de hit-test y colocación ---
        let hitTestSource = null;
        let reticle = null;

        function createReticle() {
            const geometry = new THREE.RingGeometry(0.15, 0.25, 32);
            const material = new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0x442200, side: THREE.DoubleSide, transparent: true });
            const ring = new THREE.Mesh(geometry, material);
            ring.rotation.x = -Math.PI/2;
            return ring;
        }

        function placeObject(position) {
            if (currentObject) scene.remove(currentObject);
            currentObject = createPlacedObject();
            currentObject.position.copy(position);
            scene.add(currentObject);
            document.getElementById('ar-status').innerHTML = '✅ Objeto colocado';
        }

        function onSelect() {
            if (reticle && reticle.visible) {
                placeObject(reticle.position);
            } else {
                document.getElementById('ar-status').innerHTML = '⚠️ No hay superficie detectada';
            }
        }

        // --- Configurar sesión AR ---
        async function initAR() {
            const session = renderer.xr.getSession();
            if (!session) return;
            session.addEventListener('select', onSelect);
            // Solicitar hit-test source
            const viewerRefSpace = await session.requestReferenceSpace('viewer');
            hitTestSource = await session.requestHitTestSource({ space: viewerRefSpace });
            document.getElementById('ar-status').innerHTML = '🔍 Mueve la cámara, toca para colocar';
        }

        renderer.xr.addEventListener('sessionstart', () => {
            initAR();
            if (reticle) reticle.visible = true;
        });
        renderer.xr.addEventListener('sessionend', () => {
            if (hitTestSource) hitTestSource.cancel();
            hitTestSource = null;
            if (reticle) reticle.visible = false;
            document.getElementById('ar-status').innerHTML = '🔴 AR finalizado';
        });

        // --- Botón de AR ---
        const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
        document.body.appendChild(arButton);
        // Personalizamos el botón que ya teníamos para que sea el mismo
        const existingBtn = document.querySelector('button[type="button"]');
        if (existingBtn) existingBtn.style.display = 'none';
        document.getElementById('btn-reubicar').addEventListener('click', () => {
            if (renderer.xr.isPresenting) {
                // Si ya estamos en AR, volvemos a permitir colocar borrando el objeto actual
                if (currentObject) scene.remove(currentObject);
                currentObject = null;
                document.getElementById('ar-status').innerHTML = '🔄 Toca la pantalla para reubicar';
            } else {
                arButton.click();
            }
        });

        // Reticle
        reticle = createReticle();
        reticle.visible = false;
        scene.add(reticle);

        // --- Animación (actualiza la mira) ---
        function animate() {
            if (hitTestSource && renderer.xr.isPresenting) {
                const frame = renderer.xr.getFrame();
                if (frame) {
                    const viewerRefSpace = renderer.xr.getReferenceSpace();
                    const results = frame.getHitTestResults(hitTestSource);
                    if (results.length > 0) {
                        const pose = results[0].getPose(viewerRefSpace);
                        if (pose) {
                            reticle.visible = true;
                            reticle.position.copy(pose.transform.position);
                            reticle.quaternion.copy(pose.transform.orientation);
                        }
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        // --- Vista previa sin AR (muestra la figura flotando) ---
        const previewGroup = figureGroup.clone(true);
        previewGroup.scale.set(0.6, 0.6, 0.6);
        previewGroup.position.y = -0.5;
        scene.add(previewGroup);
        // Al entrar en AR, ocultamos la previsualización
        renderer.xr.addEventListener('sessionstart', () => {
            scene.remove(previewGroup);
        });
        renderer.xr.addEventListener('sessionend', () => {
            if (!scene.children.includes(previewGroup)) scene.add(previewGroup);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('Listo. Si no funciona la RA, asegúrate de usar HTTPS y un dispositivo compatible.');
    </script>
</body>
</html>
